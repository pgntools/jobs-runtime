name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: "Typecheck (sources, tests and the contract type test)"
        run: npm run typecheck
      - name: "Test (coverage gate: 90 % lines, branches, functions, statements)"
        run: npm run test:coverage
      - name: Build
        run: npm run build
